spring.application.name=servicepulse

# Local, in-memory database. Data is discarded when the application stops.
spring.datasource.url=jdbc:h2:mem:servicepulse;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# On-demand checks stop waiting for a connection/response after these limits.
servicepulse.check.connect-timeout=2s
servicepulse.check.request-timeout=5s
