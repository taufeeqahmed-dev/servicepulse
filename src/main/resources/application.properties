spring.application.name=servicepulse

# Local file database. Registrations and checks survive application restarts.
spring.datasource.url=jdbc:h2:file:./data/servicepulse;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Manual and scheduled checks use the same HTTP timeout limits.
servicepulse.check.connect-timeout=2s
servicepulse.check.request-timeout=5s

# Wait this long before the first batch and between completed monitoring batches.
servicepulse.monitoring.enabled=true
servicepulse.monitoring.poll-interval=30s
